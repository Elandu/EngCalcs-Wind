name: Maintenance lockfile refresh

on:
  push:
    branches:
      - "automation/secure-dependency-lock-20261011"

permissions:
  contents: write

jobs:
  refresh:
    name: Refresh and audit locked dependencies
    if: github.ref == 'refs/heads/automation/secure-dependency-lock-20261011'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.28"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Refresh only the two advisory-affected dependencies
        run: uv lock --upgrade-package pyjwt --upgrade-package urllib3
      - name: Verify the lock is consistent
        run: uv lock --check
      - name: Verify the dependency vulnerability audit
        run: uv audit --locked --preview-features audit-command
      - name: Run numerical and integration regressions against refreshed lock
        run: |
          uv sync --locked --extra dev --python 3.12
          uv run --locked --no-sync pytest
      - name: Commit verified lockfile to maintenance branch only
        run: |
          git diff --exit-code -- pyproject.toml
          git add uv.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix(deps): refresh audited PyJWT and urllib3 lock entries"
            git push origin HEAD:refs/heads/automation/secure-dependency-lock-20261011
          fi
